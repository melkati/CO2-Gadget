name: Beta Release V3.0

# Create a beta: commit with message "Beta v<major>.<minor>.<patch>"
# Manifests AND firmware .bin files are deployed to GitHub Pages
# (melkati.github.io/CO2-Gadget/beta/). Binaries are no longer served from
# emariete.com because newly FTP-uploaded files there return HTTP 404 (issue #300).
#
# Architecture:
#   build_beta (matrix, parallel) â†’ uploads artifacts
#   deploy (single job, after all builds) â†’ gh-pages (manifests + .bin files)

on:
  push:
    branches:
      - development
    paths-ignore:
      - '.github/workflows/release3_beta.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.16.012)'
        required: false
        default: '0.0.0'

jobs:
  build_beta:
    # Only run when commit message contains "Beta" and does not contain "low-power",
    # or when triggered manually via workflow_dispatch.
    if: contains(github.event.head_commit.message, 'Beta') && !contains(github.event.head_commit.message, 'low-power') || github.event_name == 'workflow_dispatch'
    name: Build ${{ matrix.environment }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - esp32dev
          - esp32dev_OLED
          - TTGO_TDISPLAY
          - TTGO_TDISPLAY_SANDWICH
          - TDISPLAY_S3
          - esp32dev_ST7789_240x320
          - ttgo-t5-EINKBOARDGDEM0213B74
          - ttgo-t5-EINKBOARDDEPG0213BN
          - ttgo-t5-EINKBOARDGDEW0213M21
          - ttgo-t7-EINKBOARDGDEM029T94
          - ttgo-t7-WEACT_GDEH0154D67
          - ttgo-t7-WEACT_DEPG0213BN
          - ttgo-t7-WEACT_GxEPD2_290_BS

    env:
      CHIP_FAMILY: ${{ matrix.environment == 'TDISPLAY_S3' && 'ESP32-S3' || 'ESP32' }}

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if version exists
        id: check_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: version must be provided as input (defaults to "0.0.0")
            VERSION="${{ github.event.inputs.version || '0.0.0' }}"
            echo "Manual trigger â€” using version: $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            # Push trigger: extract version from commit message
            commit_message=$(git log --format=%B -n 1 $GITHUB_SHA)
            version_regex="Beta v([0-9]+\.[0-9]+\.[0-9]+)"
            if [[ $commit_message =~ $version_regex ]]; then
              echo "Version found: ${BASH_REMATCH[1]}"
              echo "VERSION=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            else
              echo "No valid version found in commit message. Exiting..."
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/build
          key: pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.environment }}-
            pio-

      - name: Install dependencies
        if: steps.check_version.outputs.VERSION != ''
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          platformio update

      - name: Get current date
        if: steps.check_version.outputs.VERSION != ''
        id: date
        run: |
          echo "date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Build firmware
        if: steps.check_version.outputs.VERSION != ''
        run: |
          pio run -e ${{ matrix.environment }}

      # ------------------------------------------------------------------
      # Copy bootloader/partitions/firmware to versioned filenames RIGHT
      # AWAY, before running any further `pio run` invocation. Root cause
      # of issue #300: these files were found missing by the time a later
      # step tried to read them, likely due to `build_cache_dir = .pio/build`
      # in platformio.ini interacting with PlatformIO's caching when a
      # second `pio run` (buildfs) runs afterwards.
      # ------------------------------------------------------------------
      - name: Rename firmware binaries to match manifest
        if: steps.check_version.outputs.VERSION != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          ENV_NAME: ${{ matrix.environment }}
          VER: ${{ steps.check_version.outputs.VERSION }}
        run: |
          SRC=.pio/build/${ENV_NAME}
          for part in bootloader partitions firmware; do
            cp "${SRC}/${part}.bin" "./${REPO_NAME}-${ENV_NAME}-${VER}-${part}.bin"
          done

      - name: Build filesystem
        if: steps.check_version.outputs.VERSION != ''
        run: |
          pio run -e ${{ matrix.environment }} -t buildfs

      - name: Rename spiffs binary to match manifest
        if: steps.check_version.outputs.VERSION != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          ENV_NAME: ${{ matrix.environment }}
          VER: ${{ steps.check_version.outputs.VERSION }}
        run: |
          cp ".pio/build/${ENV_NAME}/spiffs.bin" "./${REPO_NAME}-${ENV_NAME}-${VER}-spiffs.bin"

      - name: Create manifest with absolute .bin URLs
        if: steps.check_version.outputs.VERSION != ''
        id: create_manifest
        env:
          VERSION: ${{ steps.check_version.outputs.VERSION }}
          COMPILED_DATE: ${{ steps.date.outputs.date }}
          COMPILED_TIME: ${{ steps.date.outputs.time }}
        run: |
          # SPIFFS offset differs for ESP32-S3
          if [[ "${{ env.CHIP_FAMILY }}" == "ESP32-S3" ]]; then
            bootloader_offset=0
            partitions_offset=32768
            firmware_offset=65536
            spiffs_offset=13172736
          else
            bootloader_offset=4096
            partitions_offset=32768
            firmware_offset=65536
            spiffs_offset=3604480
          fi

          # Base URL for .bin files on GitHub Pages (absolute paths in manifest).
          # Same folder as the manifests; GitHub Pages sends CORS "*" headers.
          BIN_BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/beta"
          REPO_NAME="${{ github.event.repository.name }}"
          ENV_NAME="${{ matrix.environment }}"
          VER="${{ steps.check_version.outputs.VERSION }}"

          cat > ${REPO_NAME}-${ENV_NAME}.beta.manifest.json << EOF
          {
            "name": "${REPO_NAME}-${ENV_NAME}",
            "flavour": "${ENV_NAME}",
            "version": "${VER}-beta",
            "compilation_date": "${COMPILED_DATE}",
            "compilation_time": "${COMPILED_TIME}",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 20,
            "builds": [
                {
                  "chipFamily": "${{ env.CHIP_FAMILY }}",
                  "improv": true,
                  "parts": [
                    { "path": "${BIN_BASE_URL}/${REPO_NAME}-${ENV_NAME}-${VER}-bootloader.bin", "offset": ${bootloader_offset} },
                    { "path": "${BIN_BASE_URL}/${REPO_NAME}-${ENV_NAME}-${VER}-partitions.bin", "offset": ${partitions_offset} },
                    { "path": "${BIN_BASE_URL}/${REPO_NAME}-${ENV_NAME}-${VER}-firmware.bin", "offset": ${firmware_offset} },
                    { "path": "${BIN_BASE_URL}/${REPO_NAME}-${ENV_NAME}-${VER}-spiffs.bin", "offset": ${spiffs_offset} }
                  ]
                }
            ]
          }
          EOF

      - name: Upload artifact (all files for this environment)
        if: steps.check_version.outputs.VERSION != ''
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.environment }}
          path: |
            ${{ github.event.repository.name }}-${{ matrix.environment }}-${{ steps.check_version.outputs.VERSION }}-bootloader.bin
            ${{ github.event.repository.name }}-${{ matrix.environment }}-${{ steps.check_version.outputs.VERSION }}-partitions.bin
            ${{ github.event.repository.name }}-${{ matrix.environment }}-${{ steps.check_version.outputs.VERSION }}-firmware.bin
            ${{ github.event.repository.name }}-${{ matrix.environment }}-${{ steps.check_version.outputs.VERSION }}-spiffs.bin
            ${{ github.event.repository.name }}-${{ matrix.environment }}.beta.manifest.json
          retention-days: 2

  deploy:
    name: Deploy Beta Release
    needs: build_beta
    runs-on: ubuntu-latest
    # Only run if at least one build succeeded (not skipped, not failed)
    if: needs.build_beta.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./beta_firmware
          pattern: beta-*
          merge-multiple: false

      - name: List downloaded files
        run: |
          echo "=== Downloaded files ==="
          find ./beta_firmware -type f | sort

      - name: Extract version from any artifact name
        id: get_version
        run: |
          # Find any manifest to extract version
          MANIFEST=$(find ./beta_firmware -name "*.manifest.json" | head -1)
          if [ -n "$MANIFEST" ]; then
            VERSION=$(grep -oP '"version":\s*"\K[^"]+' "$MANIFEST" | sed 's/-beta//')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Found version: $VERSION"
          fi

      # force_orphan below replaces the whole gh-pages branch, so first pull the
      # existing stable manifests (gh-pages root) back in to avoid deleting them.
      - name: Fetch existing gh-pages content (to preserve stable manifests)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ./existing_pages

      - name: Organize files for GitHub Pages (manifests + .bin)
        run: |
          # Everything goes inside ./gh-pages/beta/ so it ends up at /beta/<file>
          mkdir -p ./gh-pages/beta
          find ./beta_firmware \( -name "*.manifest.json" -o -name "*.bin" \) -exec cp {} ./gh-pages/beta/ \;
          # Preserve stable files (manifests + .bin) living at the gh-pages root
          if [ -d ./existing_pages ]; then find ./existing_pages -maxdepth 1 -type f -exec cp {} ./gh-pages/ \; ; fi
          echo "=== Files for GitHub Pages ==="
          ls -laR ./gh-pages/

      # ------------------------------------------------------------------
      # Deploy manifests + .bin files to GitHub Pages
      # publish_dir=./gh-pages publishes its CONTENTS to gh-pages root
      # So ./gh-pages/beta/<files> â†’ gh-pages/beta/<files>
      # URL: melkati.github.io/CO2-Gadget/beta/<file>
      # force_orphan keeps the branch history from growing with binaries.
      # ------------------------------------------------------------------
      - name: Deploy manifests and firmware to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true
          commit_message: "Beta v${{ steps.get_version.outputs.VERSION }} manifests and firmware"

