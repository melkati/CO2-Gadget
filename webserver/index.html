<!DOCTYPE html>

<head>

    <title>CO₂ Gadget</title>

<body class="home-page">
    <!-- Navigation bar -->
    <div class="navbar" id="navbar">
        <div class="nav-content">
            <div class="nav-links-left">
                <a href="index.html">

                <a href="charts.html" class="hidden" id="chartsLink">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path d="M64 64c0-17.7-14.3-32-32-32S0 46.3 0 64V400c0 44.2 35.8 80 80 80H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H80c-8.8 0-16-7.2-16-16V64zm406.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L320 210.7l-57.4-57.4c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L240 221.3l57.4 57.4c12.5 12.5 32.8 12.5 45.3 0l128-128z" />
                    </svg>
                    <span>Charts</span>

            </div>
            <div class="nav-links-right">
                <!-- Status icon -->
                <div class="nav-icon-wrap">
                    <a href="status.html" class="nav-icon-btn" id="statusNavLink" title="Status">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg>
                    </a>
                </div>
                <!-- Preferences / Settings gear icon -->
                <div class="nav-icon-wrap">
                    <a href="preferences.html" class="nav-icon-btn" id="prefsLink" title="Preferences">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>

                    <span class="nav-update-badge hidden" id="otaBadge" title="OTA update available"></span>
                </div>
                <span id="server-status-dot" class="status-dot status-dot-hidden"
                    title="Captive portal inactive"></span>
                <!-- Theme Switch Icon -->
                <div class="iconDarkLight" id="iconBulb">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path id="iconPath" fill="currentColor"></path>
                    </svg>
                </div>
            </div>
        </div>
        <!-- Captive Portal Status Container -->
        <div id="captive-portal-status-bar" class="captive-portal-status-bar hidden-captive-portal-status-bar"></div>
    </div>

    <!-- Debug Window Container -->
    <div id="debug-window" class="debug-window hidden-debug-window"></div>

    <div class="content">
        <div class="dashboard-grid">
        <!-- CO₂ Arc Gauge Hero -->
        <div class="gauge-hero">
            <p class="gauge-label-top">Carbon Dioxide</p>
            <svg class="gauge-svg" viewBox="0 0 200 180" aria-label="CO₂ gauge">
                <!-- Track arc: 240° from bottom-left to bottom-right -->
                <path class="gauge-track" d="M30.72,150 A80,80 0 1,1 169.28,150"/>
                <!-- Fill arc -->
                <path id="co2Circle" class="gauge-fill" d="M30.72,150 A80,80 0 1,1 169.28,150"/>
                <!-- CO₂ numeric value — font-size in SVG user units so it scales with the gauge -->
                <text id="CO2Value" class="gauge-number" x="100" y="107" text-anchor="middle" dominant-baseline="middle" font-size="34">--</text>
                <!-- Unit label -->
                <text class="gauge-unit" x="100" y="129" text-anchor="middle" font-size="11">ppm CO₂</text>
                <!-- Quality label -->
                <text id="co2QualityLabel" class="gauge-quality" x="100" y="162" text-anchor="middle" font-size="12">--</text>
            </svg>
        </div>

        <!-- Temperature &amp; Humidity Cards -->
        <div class="metrics-row">
            <!-- Temperature -->
            <div class="metric-card">
                <p class="metric-card-label">Temperature</p>
                <svg class="mini-gauge-svg" viewBox="0 0 120 100" aria-label="Temperature gauge">
                    <path class="mini-gauge-track" d="M 21.03 77.5 A 45 45 0 1 1 98.97 77.5"/>
                    <path id="tempCircle" class="mini-gauge-fill" d="M 21.03 77.5 A 45 45 0 1 1 98.97 77.5"/>
                    <text x="17" y="93" class="gauge-minmax" text-anchor="middle" id="tempMinLabel" font-size="7">10°</text>
                    <text x="103" y="93" class="gauge-minmax" text-anchor="middle" id="tempMaxLabel" font-size="7">50°</text>
                    <text id="TempValue" class="mini-gauge-number" x="60" y="50" text-anchor="middle" dominant-baseline="middle" font-size="20">--</text>
                    <text class="mini-gauge-unit-label" x="60" y="69" text-anchor="middle" font-size="9">°C</text>
                </svg>
            </div>
            <!-- Humidity -->
            <div class="metric-card">
                <p class="metric-card-label">Humidity</p>
                <svg class="mini-gauge-svg" viewBox="0 0 120 100" aria-label="Humidity gauge">
                    <path class="mini-gauge-track" d="M 21.03 77.5 A 45 45 0 1 1 98.97 77.5"/>
                    <path id="humiCircle" class="mini-gauge-fill" d="M 21.03 77.5 A 45 45 0 1 1 98.97 77.5"/>
                    <text x="17" y="93" class="gauge-minmax" text-anchor="middle" font-size="7">0%</text>
                    <text x="103" y="93" class="gauge-minmax" text-anchor="middle" font-size="7">100%</text>
                    <text id="HumValue" class="mini-gauge-number" x="60" y="50" text-anchor="middle" dominant-baseline="middle" font-size="20">--</text>
                    <text class="mini-gauge-unit-label" x="60" y="69" text-anchor="middle" font-size="9">%rH</text>
                </svg>
            </div>
        </div>
        </div><!-- /.dashboard-grid -->
        <p class="update-time" id="updateTime">Loading...</p>
        <div id="statusLineContainer"><span id="co2GadgetVersion"></span></div>
    </div>
    <div id="popup"></div>
</body>
</html>
